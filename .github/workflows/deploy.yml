name: Deploy

on:
  workflow_dispatch: {}
  push:
    branches:
      - master

# 同一时间只跑一个部署
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 版本从 package.json 的 packageManager 字段读取，保证与本地一致
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 构建里带了内容校验（scripts/check.mjs）：标题缺失/重复、图片不存在、
      # 公式内侧带空格、分组目录名不合法都会让构建失败，从而不会部署。
      - name: 构建
        run: pnpm build

      - name: 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
